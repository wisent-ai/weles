name: Attest deployment manifest candidate

on:
  release:
    types: [published]

concurrency:
  group: weles-deployment-manifest-candidate
  cancel-in-progress: false

jobs:
  attest:
    if: github.event.release.prerelease && startsWith(github.event.release.tag_name, 'candidate-deployment-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.target_commitish }}
      - name: Require allowlisted release operator
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.WELES_RELEASE_APPROVERS }}
        run: |
          test -n "$APPROVERS" || {
            echo "WELES_RELEASE_APPROVERS repository variable is empty" >&2
            exit 1
          }
          printf '%s\n' "$APPROVERS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -Fqx "$ACTOR" || {
              echo "$ACTOR is not an allowlisted Weles release operator" >&2
              exit 1
            }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Download and bind declared manifest bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern deployment-manifest.json \
            --pattern deployment-manifest.json.sha256
          node scripts/release/validate-candidate-manifest.mjs \
            --manifest deployment-manifest.json \
            --source-revision "$TARGET" \
            --candidate-tag "$TAG"
          sha256sum --check --strict deployment-manifest.json.sha256
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign portable deployment provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cosign attest-blob --yes \
            --predicate deployment-manifest.json \
            --type https://weles.wisent.com/attestations/deployment-manifest/v1 \
            --bundle deployment-manifest.json.sigstore.json \
            deployment-manifest.json
          gh release upload "$TAG" deployment-manifest.json.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
