name: Figma design assets export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-design-assets-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted, macOS, stado-publisher]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build worker bundle
        run: npm ci && npm run build
      - name: Export and publish
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$HOME/.config/weles/worker.env"
          set +a
          export WELES_CREDENTIAL_SKARBIEC_URL="${WELES_CREDENTIAL_SKARBIEC_URL:-http://127.0.0.1:8895}"
          export SKARBIEC_WELES_READER_COMMAND="$GITHUB_WORKSPACE/scripts/worker/deploy/skarbiec-acquire.mjs"
          export SKARBIEC_WELES_ACQUISITION_SCOPES_FILE="$GITHUB_WORKSPACE/scripts/worker/deploy/skarbiec-acquisition-scopes.conf"
          export FIGMA_JSON_PARSER="$GITHUB_WORKSPACE/scripts/operations/parse-json-file-host.py"
          /opt/homebrew/bin/node "$GITHUB_WORKSPACE/scripts/operations/export-figma-design-assets-host.mjs"
