name: Figma design assets export

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of the Stado-selected macOS ARM64 design-export runner
        required: true
        type: string
      request_file:
        description: Absolute path to the export request JSON on the selected runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: figma-design-assets-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted, macOS, ARM64, "${{ inputs.runner_label }}"]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build worker bundle
        run: npm ci && npm run build
      - name: Export and publish
        shell: bash
        env:
          WELES_DESIGN_EXPORT_REQUEST: ${{ inputs.request_file }}
        run: |
          set -euo pipefail
          export SKARBIEC_WELES_READER_COMMAND="$GITHUB_WORKSPACE/src/worker/deploy/acquire/skarbiec-acquire.mjs"
          node "$GITHUB_WORKSPACE/dist/cli.js" design export-assets --provider figma --request "$WELES_DESIGN_EXPORT_REQUEST"
