name: Figma design assets export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-design-assets-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted, macOS, charless-mac-mini]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build worker bundle
        run: npm ci && npm run build
      - name: Export and publish
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$HOME/.config/weles/worker.env"
          set +a
          export WC_SKARBIEC_URL="$(/opt/homebrew/bin/node "$GITHUB_WORKSPACE/src/_shared/skarbiec-runtime.mjs" endpoint)"
          export SKARBIEC_WELES_READER_COMMAND="$GITHUB_WORKSPACE/src/worker/deploy/skarbiec-acquire.mjs"
          export SKARBIEC_WELES_ACQUISITION_SCOPES_FILE="$GITHUB_WORKSPACE/src/worker/deploy/skarbiec-acquisition-scopes.conf"
          /opt/homebrew/bin/node "$GITHUB_WORKSPACE/dist/cli.js" figma export-design-assets
