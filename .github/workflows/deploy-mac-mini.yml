name: deploy-mac-mini

# Auto-deploys the weles worker to the mac-mini on every push to main.
# Replaces the manual `git pull + npm run build + launchctl restart` workflow
# documented at scripts/worker/deploy/README.md:56.
#
# One-time setup on the mac-mini (NOT automated):
#   1. Generate a runner registration token at
#      https://github.com/wisent-ai/weles/settings/actions/runners/new
#   2. ssh charles@charless-mac-mini.tail6443b3.ts.net
#   3. mkdir ~/actions-runner && cd ~/actions-runner
#   4. curl -o runner.tgz -L \
#        https://github.com/actions/runner/releases/download/v2.319.1/actions-runner-osx-arm64-2.319.1.tar.gz
#      (use the latest version listed on the runner-new page)
#   5. tar xzf runner.tgz
#   6. ./config.sh \
#        --url https://github.com/wisent-ai/weles \
#        --token <REGISTRATION_TOKEN> \
#        --labels mac-mini-worker \
#        --name mac-mini-worker
#   7. ./svc.sh install && ./svc.sh start
# After step 7, every push to main runs this workflow on the mac-mini.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-mac-mini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mac-mini-worker]
    timeout-minutes: 15
    steps:
      - name: Pull + rebuild
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd ~/weles
          BEFORE_LOCK=$(shasum package-lock.json 2>/dev/null | awk '{print $1}' || echo none)
          git fetch origin main
          git reset --hard origin/main
          AFTER_LOCK=$(shasum package-lock.json 2>/dev/null | awk '{print $1}' || echo none)
          echo "lock_before=$BEFORE_LOCK lock_after=$AFTER_LOCK"
          if [ "$BEFORE_LOCK" != "$AFTER_LOCK" ]; then
            echo "package-lock.json changed — running npm ci"
            npm ci --ignore-scripts
          else
            echo "package-lock.json unchanged — skipping npm install"
          fi
          npm run build

      - name: Restart LaunchAgent
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          UID_NUM=$(id -u)
          PLIST=~/Library/LaunchAgents/com.wisent.weles-worker.plist
          if [ ! -f "$PLIST" ]; then
            echo "FAIL: $PLIST not found — first-time install must be done manually"
            exit 1
          fi
          launchctl bootout "gui/$UID_NUM" "$PLIST" 2>/dev/null || true
          launchctl bootstrap "gui/$UID_NUM" "$PLIST"
          launchctl list | grep com.wisent.weles-worker

      - name: Smoke check
        shell: bash
        run: |
          set -euo pipefail
          tail_log=~/weles/var/worker.log
          for i in $(seq 1 20); do
            if [ -f "$tail_log" ] && tail -1 "$tail_log" | grep -qE 'starting|claimed|idle'; then
              tail -3 "$tail_log"
              exit 0
            fi
            sleep 1
          done
          echo "WARN: no worker heartbeat after 20s — check worker.log manually"
          tail -10 "$tail_log" || true
