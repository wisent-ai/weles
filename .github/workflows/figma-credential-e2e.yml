name: Figma credential end to end

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-credential-e2e
  cancel-in-progress: false

jobs:
  credential:
    runs-on: [self-hosted, macOS, charless-mac-mini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Weles
        run: npm ci && npm run build
      - name: Acquire through Weles, read through Stado, verify with Figma
        env:
          WC_SKARBIEC_URL: http://127.0.0.1:8895
          WELES_SKARBIEC_URL: http://127.0.0.1:8895
        run: WELES_USER_DATA_DIR="$HOME/.local/state/weles/browser-profiles/figma-token" /opt/homebrew/bin/node tests/credentials/figma-personal-access-token.mjs
