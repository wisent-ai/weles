name: firefox-integration

# Phase 3.3 CI auto-probe. Validates a weles-firefox release end-to-end:
# downloads the tarball, extracts to the install path, launches it via
# WSession, asserts engine-level patches + firefoxUserPrefs are live.
#
# Manual trigger only to stay cost-conscious (macOS runners are pricey).
# Usage: gh workflow run firefox-integration.yml -f tag=firefox-142.0a1-weles.4

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "weles-firefox release tag to verify"
        required: true
        default: "firefox-142.0a1-weles.4"
  repository_dispatch:
    types: [firefox-release-published]

jobs:
  integration:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout weles
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm install
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Install Playwright browsers (Firefox bundled)
        run: npx playwright install firefox

      - name: Download weles-firefox release
        env:
          # WELES_FIREFOX_TOKEN is a PAT with read:org + repo scopes on
          # wisent-ai/weles-firefox (set via `gh secret set WELES_FIREFOX_TOKEN
          # --body "$(gh auth token)" --repo wisent-ai/weles`). Default
          # GITHUB_TOKEN is scoped to this repo and cannot see weles-firefox.
          GH_TOKEN: ${{ secrets.WELES_FIREFOX_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#firefox-}"
          INSTALL_DIR="$HOME/.local/share/weles-firefox/$VERSION"
          mkdir -p "$INSTALL_DIR"
          gh release download "$TAG" --repo wisent-ai/weles-firefox \
            --pattern "weles-firefox-${VERSION}-macos-arm64.tar.gz" --dir /tmp
          tar -xzf /tmp/weles-firefox-${VERSION}-macos-arm64.tar.gz -C "$INSTALL_DIR"
          # Strip macOS quarantine (extracted unsigned .app fails dyld load otherwise).
          xattr -dr com.apple.quarantine "$INSTALL_DIR/Firefox.app" || true
          # Ad-hoc codesign so dylibs load cleanly on the runner.
          codesign --force --deep --sign - "$INSTALL_DIR/Firefox.app" || true
          ls "$INSTALL_DIR"
          echo "WELES_FIREFOX_RELEASE=$TAG" >> "$GITHUB_ENV"

      - name: Diagnose binary
        run: |
          BIN="$HOME/.local/share/weles-firefox/${{ github.event.inputs.tag && github.event.inputs.tag || github.event.client_payload.tag }}"
          BIN="${BIN#$HOME/.local/share/weles-firefox/firefox-}"
          DIR="$HOME/.local/share/weles-firefox/${BIN}/Firefox.app/Contents/MacOS"
          echo "--- uname ---"; uname -a
          echo "--- codesign verify ---"; codesign --verify -v "$DIR/firefox" 2>&1 || true
          echo "--- firefox arch ---"; file "$DIR/firefox"
          echo "--- libxul arch ---"; file "$DIR/XUL" 2>/dev/null || file "$DIR/libxul.dylib" 2>/dev/null || true
          echo "--- direct run (prints XPCOM diagnostics) ---"
          DYLD_PRINT_LIBRARIES_POST_LAUNCH=1 "$DIR/firefox" --version 2>&1 | head -20 || true

      - name: Run integration test
        env:
          WELES_DISABLE_RECORDING: "1"
        run: node scripts/firefox/integration_test.mjs
