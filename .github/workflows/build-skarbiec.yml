name: Build skarbiec binary

# Builds the vendored skarbiec-entitlements-router binary on an Apple-silicon
# macOS runner and publishes it, with an openssl sha256 sidecar, to the rolling
# release skarbiec-bin-latest. The mac-mini weles worker authenticates only to
# this repo, so launch-mac.sh downloads the binary from this release with the
# worker's existing weles token. Triggers on any push touching the vendored
# source, and on manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'vendor/skarbiec/**'
      - '.github/workflows/build-skarbiec.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        working-directory: vendor/skarbiec
        run: cargo build --release --bin skarbiec-entitlements-router

      - name: Compute checksum
        working-directory: vendor/skarbiec/target/release
        run: openssl dgst -sha256 skarbiec-entitlements-router | awk '{print $NF}' > skarbiec-entitlements-router.sha256

      - name: Publish rolling release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skarbiec-bin-latest
          name: skarbiec binary (rolling arm64)
          body: Rolling Apple-silicon build of the vendored skarbiec-entitlements-router. Verify with the adjacent sha256 asset.
          files: |
            vendor/skarbiec/target/release/skarbiec-entitlements-router
            vendor/skarbiec/target/release/skarbiec-entitlements-router.sha256
