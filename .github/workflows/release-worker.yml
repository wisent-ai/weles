name: release-worker

on:
  push:
    tags:
      - "worker-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Match tag to product version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "worker-v$version"
      - name: Build worker bundle
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/worker/poll.js
          stage="$RUNNER_TEMP/weles-worker"
          mkdir -p "$stage"
          cp -R dist scripts "$stage/"
          cp package.json package-lock.json LICENSE README.md "$stage/"
          jq -n \
            --arg product "weles-worker" \
            --arg version "${GITHUB_REF_NAME#worker-v}" \
            --arg source_revision "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{product: $product, version: $version, source_revision: $source_revision, platform: "node22", built_at: $built_at}' \
            > "$stage/provenance.json"
          archive="weles-worker-${GITHUB_REF_NAME#worker-v}.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" weles-worker
          openssl dgst -sha256 -r "$archive" > "$archive.sha256"
          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Publish immutable worker release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Weles worker ${GITHUB_REF_NAME#worker-v}" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY"
