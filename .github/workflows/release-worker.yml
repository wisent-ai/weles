name: release-worker

on:
  push:
    tags:
      - "worker-v*"

concurrency:
  group: weles-worker-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require allowlisted release operator
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.WELES_RELEASE_APPROVERS }}
        run: |
          test -n "$APPROVERS" || {
            echo "WELES_RELEASE_APPROVERS repository variable is empty" >&2
            exit 1
          }
          printf '%s\n' "$APPROVERS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -Fqx "$ACTOR" || {
              echo "$ACTOR is not an allowlisted Weles release operator" >&2
              exit 1
            }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Build immutable worker bytes
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "worker-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          npm ci
          npm run build
          node scripts/release/surface.mjs > "$RUNNER_TEMP/released-surface.json"
          npm sbom --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/sbom.cyclonedx.json"
          npm prune --omit=dev
          stage="$RUNNER_TEMP/weles-worker"
          mkdir -p "$stage"
          cp -R dist scripts node_modules release "$stage/"
          cp package.json package-lock.json LICENSE README.md "$stage/"
          cp "$RUNNER_TEMP/released-surface.json" "$stage/released-surface.json"
          cp "$RUNNER_TEMP/sbom.cyclonedx.json" "$stage/sbom.cyclonedx.json"
          jq -n \
            --arg schema "weles.worker-component.v1" \
            --arg product "weles-worker" \
            --arg version "$version" \
            --arg sourceRevision "$GITHUB_SHA" \
            --arg platform "$PLATFORM" \
            --arg nodeVersion "$(node --version)" \
            '{schema: $schema, product: $product, version: $version, sourceRevision: $sourceRevision, platform: $platform, nodeVersion: $nodeVersion}' \
            > "$stage/component-manifest.json"
          jq -n \
            --arg builder "$GITHUB_WORKFLOW@$GITHUB_SHA" \
            --arg source "https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema: "weles.provenance.v1", builder: $builder, source: $source, builtAt: $builtAt}' \
            > "$stage/provenance.json"
          archive="weles-worker-$version-$PLATFORM.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" weles-worker
          openssl dgst -sha256 -r "$archive" > "$archive.sha256"
          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: worker-*
          path: artifacts
          merge-multiple: true
      - name: Publish immutable worker release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Weles worker ${GITHUB_REF_NAME#worker-v}" \
            --generate-notes \
            artifacts/*
