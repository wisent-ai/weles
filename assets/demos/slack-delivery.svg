<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Weles Slack notification delivery</title>
  <desc id="desc">A recorded Weles production action calls Slack chat.postMessage and receives an ok response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#141b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#3fc7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1100" cy="92" r="150" fill="#6d5dfc" opacity=".08"/>
  <circle cx="100" cy="610" r="180" fill="#3fc7ff" opacity=".06"/>

  <text x="80" y="92" fill="#a9b7d8" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="2">RECORDED PRODUCTION ACTION</text>
  <text x="80" y="150" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="750">Slack notification delivered</text>

  <g filter="url(#shadow)">
    <rect x="80" y="220" width="260" height="230" rx="24" fill="#161f3c" stroke="#2b3964" stroke-width="2"/>
    <rect x="112" y="254" width="56" height="56" rx="16" fill="url(#accent)"/>
    <text x="140" y="292" fill="#fff" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800">W</text>
    <text x="112" y="354" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Weles</text>
    <text x="112" y="391" fill="#9fb0d6" font-family="Inter, system-ui, sans-serif" font-size="20">authorized action</text>
  </g>

  <path d="M360 335 H505" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M489 319 L509 335 L489 351" fill="none" stroke="#3fc7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="525" y="220" width="300" height="230" rx="24" fill="#161f3c" stroke="#2b3964" stroke-width="2"/>
    <text x="557" y="274" fill="#93a6ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Slack Web API</text>
    <text x="557" y="325" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">chat.postMessage</text>
    <rect x="557" y="359" width="222" height="52" rx="12" fill="#0d1429"/>
    <text x="668" y="392" fill="#b6c4e5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18">message redacted</text>
  </g>

  <path d="M845 335 H942" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M926 319 L946 335 L926 351" fill="none" stroke="#3fc7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="965" y="220" width="155" height="230" rx="24" fill="#161f3c" stroke="#2b3964" stroke-width="2"/>
    <circle cx="1042" cy="286" r="38" fill="#2eb67d"/>
    <path d="M1023 286 L1037 300 L1062 272" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1042" y="365" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">ok: true</text>
    <text x="1042" y="401" fill="#9fb0d6" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18">delivered</text>
  </g>

  <rect x="80" y="514" width="1040" height="82" rx="20" fill="#0d1429" stroke="#25345e"/>
  <circle cx="120" cy="555" r="10" fill="#2eb67d"/>
  <text x="148" y="563" fill="#dce5fb" font-family="Inter, system-ui, sans-serif" font-size="22">Completed healthy in 1.6 seconds</text>
  <text x="1082" y="563" fill="#8fa1c7" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="20">2026-07-13</text>
</svg>
