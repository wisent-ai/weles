# weles-microsoft-lukasz-wisent-com-password belongs to a personal Microsoft
# account that only guests in the Entra tenant: the id token for that principal
# names the Microsoft consumer tenant as its identity provider, and the directory
# does not hold its password. Its lifecycle is therefore provider `microsoft`
# (adopt, rotate, verify at account.live.com), never `microsoft_entra`. The
# consumer lifecycle reads the current or staged value as
# readWelesManagedCredential(<id>, 'password'), so without this row every adopt
