[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weles"
version = "0.3.0"
description = "Stealth browser automation with fingerprint spoofing, custom CDP driver, and AI diagnostics."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Wisent AI", email = "dev@wisent.ai"}]
keywords = ["playwright", "fingerprint", "stealth", "browser", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "browserforge>=1.2",
    "websockets>=12.0",
]




[project.optional-dependencies]
playwright = ["playwright>=1.40"]
geoip = ["geoip2", "requests"]
proxy = ["httpx>=0.24"]
captcha = ["httpx>=0.24"]
all = ["httpx>=0.24", "geoip2", "requests"]

[project.urls]
Homepage = "https://github.com/wisent-ai/weles"
Repository = "https://github.com/wisent-ai/weles"

[tool.setuptools.packages.find]
include = ["weles*"]

[tool.setuptools.package-data]
weles = ["scripts/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
